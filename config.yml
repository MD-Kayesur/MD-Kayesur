# Galaxy Profile README Configuration
# Generated for: MD Kayesur
#
# Usage:
#   python -m generator.main
#
# Demo mode (no API calls):
#   python -m generator.main --demo

# Your GitHub username (required)
username: MD-Kayesur

# Profile information displayed in the galaxy header
profile:
  name: "MD Kayesur"
  tagline: "Full Stack Engineer (MERN) | Scalable Systems | Clean Architecture"
  company: "Full Stack Developer"
  location: "Bangladesh"
  bio: |
    Building high-performance, scalable web applications with modern technologies.
    Focused on delivering clean, maintainable code and solving real-world business problems.
  philosophy: '"Great software is built with clarity, scalability, and purpose — not just code."'

# Social links displayed at the bottom of the profile
social:
  github: "MD-Kayesur"

# Galaxy arms represent your core focus areas
# Each arm spirals out from the center with its own color and tech items
# Available colors: "synapse_cyan", "dendrite_violet", "axon_amber"
galaxy_arms:
  - name: "Frontend"
    color: "dendrite_violet"
    items:
      - "React.js"
      - "TypeScript"
      - "Redux"
      - "Next.js"
  - name: "Backend"
    color: "synapse_cyan"
    items:
      - "Node.js"
      - "Express.js"
      - "NestJS"
      - "REST & GraphQL"
  - name: "DevOps & Database"
    color: "axon_amber"
    items:
      - "MongoDB"
      - "Docker"
      - "CI/CD"
      - "Git"

# Featured projects shown as constellation stars
# Each project needs:
#   repo: "owner/repo-name"   — GitHub repository path
#   arm: 0-2                  — Which galaxy arm to associate with (index)
#   description: "..."        — Short description shown on the card
projects:
  - repo: "MD-Kayesur/MD-Kayesur"
    arm: 0
    description: "Personal portfolio and developer profile dashboard."

# Stats configuration — which metrics to show on the telemetry card
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Language display settings
languages:
  exclude:                     # Languages to hide from the telemetry chart
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
  max_display: 8               # Maximum number of languages to show
